org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 项目级 JDK 指定：Gradle 8.14 / AGP 8.11 需要 JDK 17+，
# 这里固定用 Android Studio 自带的 JBR 21，只对当前项目生效，
# 不依赖系统全局 JAVA_HOME（系统 JAVA_HOME 是 JDK 11，太旧）。
# 注意：路径含空格需用 \ 转义；换电脑时改这一行即可。
org.gradle.java.home=/Applications/Android\ Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# Flutter migrator 官方推荐：AGP 9 下关闭新 DSL（避免破坏旧项目构建）；
# KGP 2.3.20 在 newDsl=false + AGP 9.0.x 下兼容（KGP 2.4 反而与 newDsl=true 不兼容）
android.newDsl=false
# flutter_js 等老插件的 Java(11)/Kotlin(1.8) 目标不一致，Kotlin 2.3 默认按 error 校验；
# 降为 warning 即可（不影响产物），避免第三方插件配置导致构建失败。
kotlin.jvm.target.validation.mode=warning
